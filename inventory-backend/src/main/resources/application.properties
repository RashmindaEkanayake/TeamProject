spring.application.name=inventory-system
server.port=8080

# H2 Database Configuration (persistent file in inventory-backend/inventory-db.mv.db)
spring.datasource.url=jdbc:h2:file:./inventory-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password


# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Configurations
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# SQL Initialization Configurations
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configurations (256-bit HEX secret for signing JWTs)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Multipart File Upload (For Excel Imports, up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable custom SQL logging if needed
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
