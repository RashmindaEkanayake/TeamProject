services:
  - type: web
    name: atlas-erp-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        value: jdbc:h2:file:./data/atlas_erp;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ENABLED
        value: "true"
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: password123
      - key: BOOTSTRAP_SALES_PASSWORD
        value: password123
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: atlas-erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
